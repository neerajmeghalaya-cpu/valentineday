<!-- Code Generated by Sidekick is for learning and experimentation purposes only. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine</title>
    <style>
      :root { --bg:#fff5f7; }
      body{
        margin:0; min-height:100vh; display:grid; place-items:center;
        font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        background:var(--bg); color:#222; position:relative; overflow:hidden;
      }

      /* Cracker/firework overlay (behind the card) */
      #crackers{ position:fixed; inset:0; pointer-events:none; z-index:0; }
      .burst{
        position:absolute; width:12px; height:12px;
        transform:translate(-50%,-50%) scale(0.3); opacity:0;
        animation:burstPop 900ms ease-out forwards;
      }
      .spark{
        position:absolute; left:50%; top:50%;
        width:3px; height:22px; transform-origin:50% 100%;
        border-radius:999px; opacity:.95;
      }
      @keyframes burstPop{
        0%{opacity:0; transform:translate(-50%,-50%) scale(.2);}
        10%{opacity:1;}
        100%{opacity:0; transform:translate(-50%,-50%) scale(1.2);}
      }
      @keyframes sparkFly{
        0%{transform:rotate(var(--rot)) translateY(0); opacity:1;}
        100%{transform:rotate(var(--rot)) translateY(-90px); opacity:0;}
      }

      .card{
        width:min(560px,92vw); background:#fff; border:1px solid #eee;
        border-radius:18px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.08);
        text-align:center; position:relative; z-index:1;
      }
      h1{ margin:0 0 14px; font-size:clamp(22px,3.2vw,32px); line-height:1.2; }

      .arena{
        position:relative; margin:0 auto; width:min(480px,100%); height:170px;
        border:1px dashed #f0c6cf; border-radius:14px; background:#fff;
        overflow:hidden; display:grid; place-items:center;
      }
      .start-row{ display:flex; gap:12px; justify-content:center; align-items:center; }

      button{
        border:0; border-radius:12px; padding:12px 18px; font-size:18px;
        cursor:pointer; user-select:none;
      }
      button:active{ transform:scale(.98); }
      .yes{ background:#ff3b6a; color:#fff; }
      .no{ background:#f1f1f1; color:#222; position:static; touch-action:none; }

      .celebrate{ display:none; margin-top:6px; }
      .celebrate.show{ display:block; }
      .celebrate h2{ margin:0 0 6px; font-size:28px; }
      .celebrate p{ margin:0 0 12px; font-size:16px; color:#444; }
.celebrate img{
  width: min(420px, 100%);
  height: 260px;           /* adjust 220–320px as you like */
  object-fit: contain;     /* key: no cropping */
  object-position: center;
  background: #fff;        /* fills empty space ("letterbox") */
  border-radius: 14px;
  border: 1px solid #eee;
  display: block;
  margin: 0 auto;
}

      .funny{ margin-top:12px; min-height:1.3em; font-size:15px; color:#555; }
    </style>
  </head>
  <body>
    <div id="crackers" aria-hidden="true"></div>

    <div class="card" role="group" aria-label="Valentine question">
      <h1 id="question">Nandini will you be my valentine?</h1>

      <div class="arena" id="arena" aria-label="Answer area">
        <div class="start-row" id="startRow">
          <button class="yes" id="yesBtn" type="button">Yes ❤️</button>
          <button class="no" id="noBtn" type="button">No 😢</button>
        </div>
      </div>

      <div class="celebrate" id="celebrate" aria-live="polite">
        <h2>It’s a date!</h2>
        <p>Knew you’d say yes</p>
        <img src="./romantic2.jpg" alt="Romantic photo" />
      </div>

      <div class="funny" id="funny" aria-live="polite"></div>
    </div>

    <script>
      // Code Generated by Sidekick is for learning and experimentation purposes only.
      const question = document.getElementById("question");
      const arena = document.getElementById("arena");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const celebrate = document.getElementById("celebrate");
      const funny = document.getElementById("funny");
      const crackers = document.getElementById("crackers");

      const funnyLines = [
        "Nice try 😄",
        "No button is on a coffee break.",
        "That ‘No’ seems… shy today.",
        "Oops—slippery button!",
        "Denied. Politely.",
        "You’re getting warmer… not really.",
      ];

      let noIsArmed = false;
      let funnyTimer = null;

      function showFunny() {
        const line = funnyLines[Math.floor(Math.random() * funnyLines.length)];
        funny.textContent = line;
        clearTimeout(funnyTimer);
        funnyTimer = setTimeout(() => (funny.textContent = ""), 1200);
      }

      yesBtn.addEventListener("click", () => {
        question.style.display = "none";
        arena.style.display = "none";
        funny.textContent = "";
        celebrate.classList.add("show");
        launchCrackers(12);
      });

      function intersects(a, b) {
        return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
      }

      function armNoButtonAbsoluteAtCurrentSpot() {
        if (noIsArmed) return;
        const a = arena.getBoundingClientRect();
        const n = noBtn.getBoundingClientRect();
        noBtn.style.position = "absolute";
        noBtn.style.left = `${n.left - a.left}px`;
        noBtn.style.top = `${n.top - a.top}px`;
        noIsArmed = true;
      }

      function moveNoButtonInsideArena() {
        armNoButtonAbsoluteAtCurrentSpot();

        const a = arena.getBoundingClientRect();
        const n = noBtn.getBoundingClientRect();
        const y = yesBtn.getBoundingClientRect();

        const padding = 10;
        const maxX = Math.max(padding, a.width - n.width - padding);
        const maxY = Math.max(padding, a.height - n.height - padding);

        for (let i = 0; i < 30; i++) {
          const x = padding + Math.random() * (maxX - padding);
          const yy = padding + Math.random() * (maxY - padding);

          const candidate = {
            left: a.left + x,
            top: a.top + yy,
            right: a.left + x + n.width,
            bottom: a.top + yy + n.height,
          };

          if (!intersects(candidate, y)) {
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${yy}px`;
            return;
          }
        }

        noBtn.style.left = `${padding}px`;
        noBtn.style.top = `${padding}px`;
      }

      ["pointerenter", "mouseover", "pointerdown", "mousedown", "touchstart"].forEach((evt) => {
        noBtn.addEventListener(
          evt,
          (e) => {
            e.preventDefault();
            showFunny();
            moveNoButtonInsideArena();
          },
          { passive: false }
        );
      });

      // Crackers/fireworks
      const sparkColors = ["#86BC25", "#007CB0", "#FFD100", "#ED8B00", "#DA291C", "#62B5E5", "#C4D600"];

      function makeBurst(xPct, yPct) {
        const b = document.createElement("div");
        b.className = "burst";
        b.style.left = `${xPct}%`;
        b.style.top = `${yPct}%`;

        const sparkCount = 14;
        for (let i = 0; i < sparkCount; i++) {
          const s = document.createElement("div");
          s.className = "spark";
          const rot = Math.round((360 / sparkCount) * i + Math.random() * 8);
          s.style.setProperty("--rot", `${rot}deg`);
          s.style.background = sparkColors[Math.floor(Math.random() * sparkColors.length)];
          s.style.animation = "sparkFly 900ms ease-out forwards";
          b.appendChild(s);
        }

        crackers.appendChild(b);
        setTimeout(() => b.remove(), 1000);
      }

      function launchCrackers(bursts = 10) {
        crackers.innerHTML = "";
        for (let i = 0; i < bursts; i++) {
          const x = 10 + Math.random() * 80;
          const y = 8 + Math.random() * 50;
          setTimeout(() => makeBurst(x, y), i * 120);
        }
        setTimeout(() => makeBurst(14, 18), bursts * 120 + 80);
        setTimeout(() => makeBurst(86, 22), bursts * 120 + 180);
      }

      window.addEventListener("resize", () => {
        if (noIsArmed && arena.style.display !== "none") moveNoButtonInsideArena();
      });
    </script>
  </body>
</html>
